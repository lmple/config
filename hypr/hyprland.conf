# ─── NVIDIA env vars (must be set early) ────────────────────────────────────
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = NVD_BACKEND,direct
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0

# ─── Toolkit / Wayland env vars ─────────────────────────────────────────────
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ─── Cursor ──────────────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ─── Monitor (auto-detect; adjust as needed) ─────────────────────────────────
monitor = ,preferred,auto,1

# ─── Startup ─────────────────────────────────────────────────────────────────
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hyprpaper
exec-once = hypridle > /dev/null 2>&1
exec-once = waybar > /dev/null 2>&1
exec-once = nm-applet --indicator
exec-once = emacs --daemon

# ─── General ─────────────────────────────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(e06c75ff)
    col.inactive_border = rgba(3b3f4dcc)
    layout = dwindle
    resize_on_border = true
}

# ─── Decoration ──────────────────────────────────────────────────────────────
decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
}

# ─── Animations ──────────────────────────────────────────────────────────────
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# ─── Input ───────────────────────────────────────────────────────────────────
input {
    kb_layout = ch          # Change to your layout (us, fr, etc.)
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# ─── Layout ──────────────────────────────────────────────────────────────────
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# ─── Misc ────────────────────────────────────────────────────────────────────
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    # Critical for NVIDIA — software cursor avoids black cursor bug
    # cursor_replace_zoom = false
}

cursor {
    no_hardware_cursors = true   # Required on NVIDIA
}

gestures {
    # tune feel (these options still exist)
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_cancel_ratio = 0.5

    # new syntax: fingers, direction, action
    gesture = 3, horizontal, workspace
}

# ─── Key bindings ────────────────────────────────────────────────────────────
$mod = SUPER

bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, E, exec, thunar
bind = $mod, V, togglefloating
bind = $mod, P, exec, wofi --show drun
bind = $mod, R, pseudo
bind = $mod, F, fullscreen
bind = $mod, L, exec, hyprlock

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Move focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move window
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Resize
binde = $mod ALT, H, resizeactive, -30 0
binde = $mod ALT, L, resizeactive, 30 0
binde = $mod ALT, K, resizeactive, 0 -30
binde = $mod ALT, J, resizeactive, 0 30

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Mouse window control
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
