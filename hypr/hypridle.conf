# hypridle: lock on idle and before sleep. Started by hyprland.lua.
# Every lock goes through `loginctl lock-session` (Super+L too), which
# hypridle turns into lock_cmd, so there is one way in and one hyprlock.

general {
    # One hyprlock at a time: a second instance would ask for the password again
    lock_cmd = pidof hyprlock || hyprlock
    # Locked before suspend, so the screen never shows unlocked on resume
    before_sleep_cmd = loginctl lock-session
    # Hyprland 0.57 dispatches take Lua; wake the screen without a key press
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 600 # 10 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660 # 11 min, a minute after the lock
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1800 # 30 min
    on-timeout = systemctl suspend
}
