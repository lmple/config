background {
    monitor =
    path = screenshot           # blurs your current screen
    blur_size = 7
    blur_passes = 3
    brightness = 0.6
    contrast = 1.0
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    # Ashen: red-ember like the active window border, on the background
    outer_color = rgba(b14242ff)
    inner_color = rgba(121212dd)
    font_color = rgba(b4b4b4ff)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = rgba(4a8b8bff)        # blue: Ashen has no green
    fail_color = rgba(c53030ff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(e5a72aff)
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = FiraCode Nerd Font
    color = rgba(b4b4b4ff)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 18
    font_family = FiraCode Nerd Font
    color = rgba(949494cc)
    position = 0, 80
    halign = center
    valign = center
}
