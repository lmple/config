background {
    monitor =
    path = screenshot           # blurs your current screen
    blur_size = 7
    blur_passes = 3
    brightness = 0.6
    contrast = 1.0
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    # Catppuccin Mocha: green like the active window border, on base
    outer_color = rgba(a6e3a1ff)
    inner_color = rgba(1e1e2edd)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = rgba(89b4faff)        # blue, so checking differs from the green ring
    fail_color = rgba(f38ba8ff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(f9e2afff)
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = FiraCode Nerd Font
    color = rgba(cdd6f4ff)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 18
    font_family = FiraCode Nerd Font
    color = rgba(a6adc8cc)
    position = 0, 80
    halign = center
    valign = center
}
