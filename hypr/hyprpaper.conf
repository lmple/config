# The image is per machine and not in the repo: ~/Pictures/wallpaper.jpg is a
# symlink to it. Repoint the link and restart hyprpaper to change it. Without
# the link, hyprpaper draws nothing.
wallpaper {
    # Empty: every monitor
    monitor =
    path = ~/Pictures/wallpaper.jpg
    # Fill the screen, cropping a 16:9 image's sides on a 16:10 panel
    fit_mode = cover
}

splash = false
