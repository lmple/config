# Starship prompt configuration

# Prompt format
format = """
[╭─](comment)$os$hostname$directory$git_branch$git_commit$git_state$git_status$fill$python$nodejs$rust${custom.lean}$java$aws$jobs$cmd_duration$status$time
[╰─](comment)$character"""

right_format = ""

# Don't add blank line before prompt
add_newline = false

# Catppuccin Mocha palette (https://catppuccin.com/palette). Its keys override
# Starship's colour names, so "green", "red"... resolve to exact Mocha hex.
palette = "catppuccin_mocha"

# Fill between left and right
[fill]
symbol = "·"
style = "comment"

# OS icon
[os]
disabled = false
style = "fg:foreground bg:current_line"
format = "[$symbol ]($style)"

[os.symbols]
Arch = "\uf303"
EndeavourOS = "\uf322"
Manjaro = "\uf312"
Linux = "\uf17c"
Macos = "\uf179"
Ubuntu = "\uf31b"

# Hostname - only over SSH, so a remote shell can't be mistaken for a local one
[hostname]
ssh_only = true
style = "fg:red bg:current_line"
format = "[ $ssh_symbol$hostname ]($style)"

# Directory
[directory]
style = "fg:green bg:current_line"
# Read-only marker explains a failed write before it is attempted
format = "[ $path ]($style)([$read_only ]($read_only_style))"
read_only = "\U000f033e"
read_only_style = "fg:red bg:current_line"
truncation_length = 0
truncate_to_repo = false

# Git branch
[git_branch]
style = "fg:pink bg:current_line"
format = "[ $symbol$branch ]($style)"
symbol = "\ue0a0 "

# Git status - off for safety: computing it runs the clean filters a repo's own
# .git/config names (filter.<x>.clean, via .gitattributes), so a mere cd into an
# untrusted repo ran its code. Starship neutralises core.fsmonitor but not
# those. Same reason Emacs's vc is off (doom/config.el); magit shows the status.
# The other git modules only read refs and HEAD, which runs nothing.
[git_status]
disabled = true
style = "fg:red bg:current_line"
# Outer conditional group drops the padding too when the tree is clean
format = "([ $all_status$ahead_behind ]($style))"

# Git state - surfaces an in-progress rebase/merge/cherry-pick, which the
# branch name alone hides
[git_state]
style = "fg:yellow bg:current_line"
format = '[ $state( $progress_current/$progress_total) ]($style)'

# Git commit - only shown on a detached HEAD, where there is no branch name
[git_commit]
style = "fg:purple bg:current_line"
format = "[ $hash ]($style)"
only_detached = true

# Python - shows the interpreter version (not the pyenv version name)
# and the active virtualenv
[python]
style = "fg:cyan bg:current_line"
symbol = "\ue73c "
format = '[ ${symbol}${pyenv_prefix}${version}( \($virtualenv\)) ]($style)'
detect_extensions = ["py"]
detect_files = [
  ".python-version",
  "pyproject.toml",
  "requirements.txt",
  "setup.py",
  "Pipfile",
]
detect_folders = [".venv", "venv"]
pyenv_version_name = false
pyenv_prefix = ""

# AWS profile
[aws]
style = "fg:orange bg:current_line"
format = "[ $symbol$profile( $region) ]($style)"
symbol = "\ue7ad "

# Command duration
[cmd_duration]
style = "fg:yellow bg:current_line"
format = "[ \U000f051f $duration ]($style)"
min_time = 2_000
# Desktop notification when a long build (e.g. a Lean build) finishes
# while the terminal is out of sight
show_notifications = true
min_time_to_notify = 45_000

# Exit code - the red prompt character only says "failed", not why
# (e.g. 127 = not found, 130 = Ctrl-C). Hidden on success.
[status]
disabled = false
style = "fg:red bg:current_line"
format = "[ ✘ $status ]($style)"

# Background jobs - easy to forget a process suspended with Ctrl-Z
[jobs]
style = "fg:purple bg:current_line"
format = "[ $symbol$number ]($style)"
number_threshold = 1

# Time
[time]
disabled = false
style = "fg:foreground bg:current_line"
format = "[ $time ]($style)"
time_format = "%H:%M:%S"

# Prompt character
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

# Language versions - only shown inside a matching project
[nodejs]
disabled = false
style = "fg:green bg:current_line"
format = "[ \U000f0399 $version ]($style)"

[rust]
disabled = false
style = "fg:orange bg:current_line"
format = "[ \ue7a8 $version ]($style)"

# Lean 4 - no built-in module. Read lean-toolchain instead of running
# `lean --version`, which goes through elan and may download a toolchain
# just to draw the prompt. Only detected at the project root.
[custom.lean]
detect_files = ["lean-toolchain"]
command = "cut -d: -f2 lean-toolchain"
shell = ["sh"]
style = "fg:foreground bg:current_line"
format = "[ ∀ $output ]($style)"

[java]
disabled = false
style = "fg:orange bg:current_line"
symbol = "\ue738 "
format = "[ $symbol$version ]($style)"

# Catppuccin Mocha, referenced by `palette` at the top. The keys are role
# names the styles above already use, each mapped to its Mocha colour (named
# after the value); cyan is teal, the colour alacritty/theme.toml puts in the
# terminal's cyan slot, so the prompt matches the terminal.
[palettes.catppuccin_mocha]
background = "#1e1e2e"   # base
current_line = "#313244" # surface0
foreground = "#cdd6f4"   # text
comment = "#6c7086"      # overlay0
cyan = "#94e2d5"         # teal
green = "#a6e3a1"
orange = "#fab387"       # peach
pink = "#f5c2e7"
purple = "#cba6f7"       # mauve
red = "#f38ba8"
yellow = "#f9e2af"
