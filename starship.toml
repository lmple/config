# Starship prompt configuration

# Prompt format
format = """
[╭─](238)$os$hostname$directory$git_branch$git_commit$git_state$git_status$fill$python$nodejs$rust$haskell${custom.lean}${custom.coq}$scala$java$kotlin$lua$ocaml$aws$jobs$cmd_duration$status$time
[╰─](238)$character"""

right_format = ""

# Don't add blank line before prompt
add_newline = false

# Fill between left and right
[fill]
symbol = "·"
style = "238"

# OS icon
[os]
disabled = false
style = "fg:255 bg:234"
format = "[$symbol ]($style)"

[os.symbols]
Arch = ""
EndeavourOS = "λ"
Linux = ""
Macos = ""

# Hostname - only over SSH, so a remote shell can't be mistaken for a local one
[hostname]
ssh_only = true
style = "fg:208 bg:234"
format = "[ $ssh_symbol$hostname ]($style)"

# Directory
[directory]
style = "fg:39 bg:234"
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = false

# Git branch
[git_branch]
style = "fg:green bg:234"
format = "[ $symbol$branch ]($style)"
symbol = " "

# Git status
[git_status]
style = "fg:red bg:234"
format = "[$all_status$ahead_behind]($style)"

# Git state - surfaces an in-progress rebase/merge/cherry-pick, which the
# branch name alone hides
[git_state]
style = "fg:yellow bg:234"
format = '[ $state( $progress_current/$progress_total) ]($style)'

# Git commit - only shown on a detached HEAD, where there is no branch name
[git_commit]
style = "fg:purple bg:234"
format = "[ $hash ]($style)"
only_detached = true

# Python - shows pyenv version and virtualenv
[python]
style = "fg:37 bg:234"
format = '[  ${pyenv_prefix}${version}( \($virtualenv\)) ]($style)'
detect_extensions = ["py"]
detect_files = [".python-version", "pyproject.toml", "requirements.txt", "setup.py", "Pipfile"]
detect_folders = [".venv", "venv"]
pyenv_version_name = false
pyenv_prefix = ""

# AWS profile
[aws]
style = "fg:208 bg:234"
format = "[ $symbol$profile( $region) ]($style)"
symbol = " "

# Command duration
[cmd_duration]
style = "fg:yellow bg:234"
format = "[ 󰔟 $duration ]($style)"
min_time = 2_000
# Desktop notification when a long build (Lean, Coq, cabal...) finishes
# while the terminal is out of sight
show_notifications = true
min_time_to_notify = 45_000

# Exit code - the red prompt character only says "failed", not why
# (e.g. 127 = not found, 130 = Ctrl-C). Hidden on success.
[status]
disabled = false
style = "fg:red bg:234"
format = "[ ✘ $status ]($style)"

# Background jobs - easy to forget a process suspended with Ctrl-Z
[jobs]
style = "fg:blue bg:234"
format = "[ $symbol$number ]($style)"
number_threshold = 1

# Time
[time]
disabled = false
style = "fg:white bg:234"
format = "[ $time ]($style)"
time_format = "%H:%M:%S"

# Prompt character
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

# Language versions - only shown inside a matching project
[nodejs]
disabled = false
style = "fg:green bg:234"
format = "[ 󰎙 $version ]($style)"

[rust]
disabled = false
style = "fg:208 bg:234"
format = "[ 🦀 $version ]($style)"

# Haskell - default symbol is λ, already used for the EndeavourOS icon
[haskell]
style = "fg:133 bg:234"
format = "[ $symbol$version ]($style)"
symbol = " "

# Lean 4 - no built-in module. Read lean-toolchain instead of running
# `lean --version`, which goes through elan and may download a toolchain
# just to draw the prompt. Only detected at the project root.
[custom.lean]
detect_files = ["lean-toolchain"]
command = "cut -d: -f2 lean-toolchain"
shell = ["sh"]
style = "fg:white bg:234"
format = "[ ∀ $output ]($style)"

# Coq/Rocq - no built-in module. Rocq 9 still ships coqc for compatibility.
[custom.coq]
detect_files = ["_CoqProject", "_RocqProject"]
command = "coqc --print-version | cut -d' ' -f1"
shell = ["sh"]
style = "fg:208 bg:234"
format = "[ 🐓 $output ]($style)"

[scala]
disabled = false
style = "fg:red bg:234"
format = "[ $version ]($style)"

[java]
disabled = false
style = "fg:208 bg:234"
format = "[ $version ]($style)"

[kotlin]
disabled = false
style = "fg:133 bg:234"
format = "[ $version ]($style)"

[lua]
disabled = false
style = "fg:27 bg:234"
format = "[ $version ]($style)"

[ocaml]
disabled = false
style = "fg:208 bg:234"
format = "[ 🐫 $version ]($style)"
