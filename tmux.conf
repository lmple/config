# Enable mouse support (select panes, resize, scroll)
set -g mouse on

# Increase scrollback history
set -g history-limit 100000

# Better scrolling in copy mode
setw -g mode-keys vi

# Start copy mode automatically when scrolling with mouse wheel
bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" \
  "send-keys -M" \
  "copy-mode -e"

# Faster escape time
set -sg escape-time 10

# Let Emacs and other apps detect window focus changes
set -g focus-events on

# Allow true color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
