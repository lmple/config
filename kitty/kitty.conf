# kitty, set up to behave like alacritty/alacritty.toml: zellij (started by
# zshrc) does the tabs, splits and sessions, kitty only draws.
include theme.conf

# Font: FiraCode has no italic, so Light stands in for it, as in Alacritty.
# Unlike Alacritty, kitty draws FiraCode's ligatures (->, !=, >=); the one
# under the cursor is split, so editing inside it stays readable.
font_family      family="FiraCode Nerd Font" style=Regular
bold_font        family="FiraCode Nerd Font" style=Bold
italic_font      family="FiraCode Nerd Font" style=Light
bold_italic_font family="FiraCode Nerd Font" style=Bold
font_size 10.0
# Alacritty's font.offset.y = 2: a bit of line spacing
modify_font cell_height +2px
disable_ligatures cursor

scrollback_lines 10000
wheel_scroll_multiplier 3.0

# Alacritty's selection.save_to_clipboard
copy_on_select clipboard

cursor_shape block
cursor_blink_interval 0.6
# 0 blinks forever, like Alacritty; kitty stops after 15 s idle by default
cursor_stop_blinking_after 0

window_padding_width 8
background_opacity 1.0

# Alacritty doesn't ask either: closing a window only detaches its zellij
# session (on_force_close "detach" in zellij/config.kdl)
confirm_os_window_close 0

# Off: kitty would load its zsh integration around zshrc (through ZDOTDIR),
# which starts zellij itself. Prompt marks and cwd tracking are zellij's job.
shell_integration disabled

# TERM stays kitty's own xterm-kitty, unlike Alacritty's xterm-256color: only
# zellij sees it, and panes get zellij's TERM.

# URLs. Click opens a link; inside zellij, hold Shift, as zellij takes the
# mouse otherwise (kitty's default for "grabbed" mouse). A URL that zellij
# wraps is still cut at the row end (zellij-org/zellij#3436): use Alt u there.
# Outside zellij, kitty joins wrapped lines, so long URLs are whole.
detect_urls yes
url_style curly

# Only the shortcuts Alacritty has, so kitty's own (new tab, new window,
# layouts) never take keys meant for zellij or Helix.
clear_all_shortcuts yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+plus  change_font_size all +1.0
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0
# URL hints, as Alacritty's Ctrl+Shift+O (open) and Ctrl+Shift+Y (copy)
map ctrl+shift+o open_url_with_hints
map ctrl+shift+y kitten hints --type url --program @
# Not in Alacritty, which reloads on save: re-read this file
map ctrl+shift+f5 load_config_file
