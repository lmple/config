; llama-server router presets for the work machine (24 GB GPU).
; Start with the router command in the README (--models-max 1 keeps a single
; model in VRAM); switch between these in gptel's menu.
version = 1

; Shared by every model. Keep each context at 16384 or more: gptel's tools cap
; their output (`my/gptel-tool-max-chars' in doom/config.el) for a 16k context.
[*]
; One user, so one slot: every token of context goes to that conversation.
np = 1
; An 8-bit KV cache halves its memory, leaving room for longer contexts.
ctk = q8_0
ctv = q8_0
; gptel sends text only, so skip loading the vision projector.
mmproj-auto = false

; The context sizes below are estimates for 24 GB, not measured yet: check
; n_ctx with /props?model=<name> and VRAM with nvidia-smi, and lower c if a
; model spills onto the CPU.

; Mixture of experts with ~4B active parameters: fast, so it's the default.
[gemma-4-26b-a4b]
hf-repo = ggml-org/gemma-4-26B-A4B-it-GGUF:Q4_0
c = 65536
load-on-startup = true

; Tuned for coding and tool calls; also a mixture of experts (~3B active).
[qwen3-coder-30b]
hf-repo = ggml-org/Qwen3-Coder-30B-A3B-Instruct-GGUF:Q4_K_M
c = 32768

; Dense and the strongest Gemma 4, but slower and with less room for context.
[gemma-4-31b]
hf-repo = ggml-org/gemma-4-31B-it-GGUF:Q4_0
c = 32768
