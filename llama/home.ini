; llama-server router presets for the home laptop (8 GB GPU).
; Start with the router command in the README; each section is a model name
; gptel can pick, and keys are llama-server flags without the leading dashes.
version = 1

; Shared by every model. Keep each context at 16384 or more: gptel's tools cap
; their output (`my/gptel-tool-max-chars' in doom/config.el) for a 16k context.
[*]
; One user, so one slot: every token of context goes to that conversation.
np = 1
; An 8-bit KV cache halves its memory, which is what makes 16k fit next to the
; weights.
ctk = q8_0
ctv = q8_0
; gptel sends text only, so skip loading the vision projector.
mmproj-auto = false

[gemma-4-12b]
hf-repo = ggml-org/gemma-4-12B-it-GGUF:Q4_0
; --fit picks the GPU layers; this sets the context it has to keep.
fit-ctx = 16384
load-on-startup = true
